name: Install Expo Notifications

on:
  push:
    branches: [refonte-ux-v2]
    paths:
      - .github/workflows/install-expo-notifications.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refonte-ux-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install expo-notifications@~0.32.17 --save-exact
      - name: Commit dependency files
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(push): install expo-notifications"
          git push origin HEAD:refonte-ux-v2
