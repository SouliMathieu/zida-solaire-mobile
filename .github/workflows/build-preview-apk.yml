name: Build Preview APK

on:
  workflow_dispatch:
  push:
    branches: [refonte-ux-v2]
    paths:
      - .github/workflows/build-preview-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets."
            echo "Create an Expo access token and save it as repository secret EXPO_TOKEN, then re-run this workflow."
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: Build Android preview APK with EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          if [ -f eas-build.json ]; then
            echo '### EAS Android preview build' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat eas-build.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EAS build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-preview-build-metadata
          path: eas-build.json
          if-no-files-found: ignore
