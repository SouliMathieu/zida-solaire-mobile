name: Build Preview APK

# La compilation APK est déclenchée uniquement à la demande.
# Une fusion de PR ne doit jamais lancer automatiquement un APK.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configure Firebase for Android push notifications
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Le secret GitHub GOOGLE_SERVICES_JSON_BASE64 est manquant. Ajoutez le google-services.json Firebase de com.zidasolaire.mobile encodé en Base64 avant de construire un APK avec notifications push."
            exit 1
          fi
          printf "%s" "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          node <<'NODE'
          const fs = require('node:fs');
          const google = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const packageName = 'com.zidasolaire.mobile';
          const found = (google.client || []).some(client => client.client_info?.android_client_info?.package_name === packageName);
          if (!google.project_info?.project_number || !found) {
            throw new Error('google-services.json invalide ou ne correspondant pas à ' + packageName);
          }
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.android.googleServicesFile = './google-services.json';
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('Configuration Firebase Android validée pour ' + packageName);
          NODE
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found"
            find android/app/build/outputs -maxdepth 5 -type f || true
            exit 1
          fi
          cp "$APK_PATH" dist/ZIDA-SOLAIRE-preview.apk
          ls -lh dist/ZIDA-SOLAIRE-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIDA-SOLAIRE-preview-apk
          path: dist/ZIDA-SOLAIRE-preview.apk
          retention-days: 14
          if-no-files-found: error
