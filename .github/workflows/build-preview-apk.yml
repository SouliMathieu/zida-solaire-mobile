name: Build Preview APK

on:
  workflow_dispatch:
  push:
    branches: [refonte-ux-v2]
    paths:
      - .github/workflows/build-preview-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found"
            find android/app/build/outputs -maxdepth 5 -type f || true
            exit 1
          fi
          cp "$APK_PATH" dist/ZIDA-SOLAIRE-preview.apk
          ls -lh dist/ZIDA-SOLAIRE-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIDA-SOLAIRE-preview-apk
          path: dist/ZIDA-SOLAIRE-preview.apk
          retention-days: 14
          if-no-files-found: error
